# Data acquisition config (Phase 1a).
# Seasons are inclusive. 2013 start gives us 2014+ as usable training rows
# once year-over-year deltas require a prior season.
# end=2026 (Phase 6): the 2026 season has not kicked off yet (current offseason
# roster == preseason roster). rosters/schedules/draft_picks/combine/players/
# ff_playerids already carry real 2026 rows; player_stats/snap_counts/
# depth_charts/ff_opportunity/ngs_*/ftn_charting will stay empty for 2026
# until Week 1 is played -- see README's "Known data issues".
seasons:
  start: 2013
  end: 2026

# Datasets pulled from nflverse via nflreadpy.
# first_available documents when the source actually begins; pulls are clipped
# to it so we don't request seasons that cannot exist. last_available caps the
# other end the same way: a dataset that only has games-played data (weekly
# stats, snaps, depth charts, NGS, FTN, ff_opportunity) genuinely has nothing
# for a season before its Week 1 is played, and unlike a normal "zero rows,
# no error" gap (2025 depth_charts), requesting 2026 from these specific
# loaders either raises (player_stats: 404 on a release file that doesn't
# exist yet; snap_counts: nflreadpy hard-validates "season must be <= 2025")
# or silently returns a different, schema-incompatible "current state"
# payload instead of a per-season snapshot (depth_charts: 12 cols/no season
# column for [2026] vs. the normal 26-col/season-keyed historical shape) --
# verified directly against each loader before adding this cap. Set 5 lines
# below the global seasons.end so this file's history stays self-documenting
# once a season's real data starts flowing (just delete the cap for that one
# dataset; nothing else needs to change).
# required=false means the pipeline must run with this dataset absent/null.
datasets:
  player_stats:
    loader: load_player_stats
    seasonal: true
    first_available: 1999
    last_available: 2025 # 2026 release file 404s -- season not played yet
    required: true
  snap_counts:
    loader: load_snap_counts
    seasonal: true
    first_available: 2012
    last_available: 2025 # nflreadpy raises ValueError for season > 2025
    required: true
  depth_charts:
    loader: load_depth_charts
    seasonal: true
    first_available: 2001
    last_available: 2024 # 2025 returns 0 rows; 2026 returns a different, non-seasonal schema (see above)
    required: true
  rosters:
    loader: load_rosters
    seasonal: true
    first_available: 1999
    required: true
  schedules:
    loader: load_schedules
    seasonal: true
    first_available: 1999
    required: true
  # Weekly rosters exist to answer one question the season-level rosters
  # cannot: who was on the team at Week 1, BEFORE any in-season trades. The
  # season-level table reflects the player's final team, which is future
  # information relative to preseason prediction (e.g. Davante Adams 2024
  # reads NYJ, his October trade destination).
  rosters_weekly:
    loader: load_rosters_weekly
    seasonal: true
    first_available: 2002
    last_available: 2025 # nflreadpy raises ValueError for season > 2025; no Week-1 has been played
    required: true
  draft_picks:
    loader: load_draft_picks
    seasonal: false
    first_available: 1980
    required: true
  combine:
    loader: load_combine
    seasonal: false
    first_available: 2000
    required: true
  players:
    loader: load_players
    seasonal: false
    required: true
  ff_playerids:
    loader: load_ff_playerids
    seasonal: false
    required: true
    # nflreadpy hardcodes the github.com/<org>/<repo>/raw/... form of this URL,
    # which this environment's egress proxy rejects with 403. The canonical
    # raw.githubusercontent.com host serves the identical file. Same source,
    # same commit — only the host differs.
    fallback_csv_url: https://raw.githubusercontent.com/dynastyprocess/data/master/files/db_playerids.csv
  ff_opportunity:
    loader: load_ff_opportunity
    seasonal: true
    first_available: 2006
    last_available: 2025 # weekly expected-points data; nothing exists for a season with no games played
    required: true
    kwargs:
      stat_type: weekly
  ngs_passing:
    loader: load_nextgen_stats
    seasonal: true
    first_available: 2016
    last_available: 2025
    required: false
    kwargs:
      stat_type: passing
  ngs_receiving:
    loader: load_nextgen_stats
    seasonal: true
    first_available: 2016
    last_available: 2025
    required: false
    kwargs:
      stat_type: receiving
  ngs_rushing:
    loader: load_nextgen_stats
    seasonal: true
    first_available: 2016
    last_available: 2025
    required: false
    kwargs:
      stat_type: rushing
  ftn_charting:
    loader: load_ftn_charting
    seasonal: true
    first_available: 2022
    last_available: 2025
    required: false
  # v1.5 (Phase C): play-by-play, for red-zone/goal-line share features
  # (src.features.wr's rz_target_share_n1 etc., inherited by TE; src.features.rb's
  # rz_carry_share_n1/goal_line_carry_share_n1). v1 deliberately skipped pbp
  # entirely (see README's "Play-by-play is deliberately not pulled" note) --
  # 13 seasons of full pbp is multiple GB and this pipeline's disk allowance is
  # fixed. `select_columns` below is applied by src.ingest.nflverse.pull_dataset
  # IMMEDIATELY after the loader call, before anything is written to disk --
  # nflreadpy.load_pbp() has no column-selection kwarg of its own (checked
  # directly against its signature), so the full ~370-column frame exists only
  # transiently in memory for one pull; only the slim frame below is
  # ever cached to data/raw/pbp.parquet. Never widen this list without checking
  # the resulting file size stays well under the ~200MB budget (see the README's
  # v1.5 section for the actual size on this build).
  # v2.2 addition: game_id/play_id -- needed to join FTN's charting data
  # (data/raw/ftn_charting.parquet, its own nflverse_game_id/nflverse_play_id)
  # onto pbp for src.features.shared.ftn_catchable_target_rate_table (the
  # catchable-target-rate efficiency proxy). Verified these are the correct join
  # keys directly against a live pull: every 2023-season FTN row matches exactly
  # one pbp play (48,225/48,225) on (game_id, play_id) == (nflverse_game_id,
  # nflverse_play_id). Kept in the same slim select (not a second pbp pull) --
  # still well under the size budget, both plain low-cardinality columns.
  pbp:
    loader: load_pbp
    seasonal: true
    first_available: 1999
    last_available: 2025 # no 2026 games played yet
    required: false
    select_columns:
      - season
      - week
      - season_type
      - posteam
      - yardline_100
      - pass_attempt
      - rush_attempt
      - receiver_player_id
      - rusher_player_id
      - game_id
      - play_id
      - complete_pass
      - touchdown
  ff_ecr:
    loader: load_ff_rankings
    seasonal: false
    required: true
    kwargs:
      type: all
    # nflreadpy hardcodes the github.com/<org>/<repo>/raw/... form of this URL,
    # which this environment's egress proxy rejects with 403. The canonical
    # raw.githubusercontent.com host serves the identical file. Same source,
    # same commit — only the host differs. File is large (~39MB, 1.8M rows);
    # in this environment the loader call itself fails and we always land on
    # the fallback.
    fallback_parquet_url: https://raw.githubusercontent.com/dynastyprocess/data/master/files/db_fpecr.parquet
