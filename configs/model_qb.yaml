# QB model config (Phase 4). src/models/train.py reads this (via the
# thin src/models/train_qb.py wrapper) rather than hardcoding
# hyperparameter search bounds / seeds / feature lists. Structure and
# every non-feature-name value is a direct port of configs/model_wr.yaml
# — only logistic_feature_subset is QB-specific. Per the brief, the
# rushing-volume columns (rush_attempts_pg_n1, rush_yards_pg_n1) are
# "weighted fully" here, i.e. deliberately included in the curated subset
# rather than left to the tree heads alone.

seed: 42

optuna:
  classifier_trials: 60 # per model type (LGBM, XGB), on the 4 validation folds
  regression_trials: 30 # per model type (LGBM, XGB) — fewer, per the brief
  tiny_trials: 5 # used by tests/test_models_positions.py; keeps CI fast

# Curated subset for the L2 logistic head. Deliberately small and
# low-null — logistic regression has no native handling of missing
# values or high-cardinality/high-null columns the way the tree models do.
# expectation_pos_rank is legitimate: it is knowable before Week 1 (the
# preseason market's own rank), not a leak. rush_attempts_pg_n1 /
# rush_yards_pg_n1 are included per the brief ("weight these fully").
logistic_feature_subset:
  - expectation_pos_rank
  - age
  - year_in_league
  - log_draft_pick
  - games_prior
  - pass_attempts_pg_n1
  - ppr_ppg_n1
  - rush_attempts_pg_n1
  - rush_yards_pg_n1
  - td_rate_n1
  - efficiency_residual_pg_n1
  - team_change
  - new_oc_interaction
  - supporting_cast_capital
  - team_plays_pg_prior

# adp_source is one-hot encoded (ecr / proxy / capped) for the logistic
# head; ecr is the dropped baseline category (2020-2025, the real-market
# era) so the two coefficients read as "proxy-era" / "capped" effects
# relative to it. Identical across every position — adp_source lives on
# labels.parquet, not the position feature table.
adp_source_categories: [ecr, proxy, capped]
adp_source_baseline: ecr

# v1.5 Phase C: Vegas team features (implied_ppg/implied_win_prob/has_vegas,
# src.ingest.vegas -> src.features.shared.attach_vegas_team) are always added to
# the feature matrix, but this position's own trees only see them once the
# promotion experiment (src.models.vegas_experiment) shows a holdout top-10-
# precision improvement -- see that module's docstring for the frozen-
# hyperparameter retrain/compare protocol. Listed here (excluded) by default;
# a promoted position has this list emptied by the experiment run.
excluded_features: [implied_ppg, implied_win_prob, has_vegas]

# LGBM/XGB train on every numeric feature column in features_qb.parquet
# (identifiers/labels excluded) — trees handle nulls and high cardinality
# natively, no reason to restrict them to the logistic subset.

search_space:
  lgbm:
    max_depth: [3, 5]
    num_leaves: [7, 31]
    min_child_samples: [30, 100] # deliberately high floor — guards against overfitting a smaller-than-WR pool
    learning_rate: [0.01, 0.1]
    n_estimators: [100, 600]
    reg_alpha: [0.0, 5.0] # L1
    reg_lambda: [0.0, 5.0] # L2
    subsample: [0.6, 1.0]
    colsample_bytree: [0.6, 1.0]
  xgb:
    max_depth: [3, 5]
    min_child_weight: [5, 50] # XGB's analogue of min_child_samples
    learning_rate: [0.01, 0.1]
    n_estimators: [100, 600]
    reg_alpha: [0.0, 5.0] # L1
    reg_lambda: [0.0, 5.0] # L2
    subsample: [0.6, 1.0]
    colsample_bytree: [0.6, 1.0]
  logistic:
    # Small fixed grid (not Optuna — the brief scopes Optuna tuning to
    # LGBM/XGB only), evaluated the same way: mean validation PR-AUC
    # across the 4 folds.
    C: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0]

blend:
  grid_step: 0.1 # simplex step for the classifier-trio blend-weight grid search

calibration:
  method_search: [isotonic, platt] # isotonic first choice; falls back to platt if it hurts pooled val Brier

# Age-adjusted-ADP baseline (Deliverable 3.3). Fixed constants, not
# tuned — same constants as WR's config (the brief only says to adapt
# these per position if the config already parameterizes them; QBs break
# out later than WR/RB on average, but the brief gives no QB-specific
# curve to encode, so the WR constants are kept as-is).
baselines:
  age_adjusted_adp:
    age_bonus: 15
    age_threshold: 25 # bonus applies when age <= this
    year_in_league_bonus: 10
    year_in_league_eligible: [1, 2]
