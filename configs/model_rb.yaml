# RB model config (Phase 4). src/models/train.py reads this (via the
# thin src/models/train_rb.py wrapper) rather than hardcoding
# hyperparameter search bounds / seeds / feature lists. Structure and
# every non-feature-name value is a direct port of configs/model_wr.yaml
# — only logistic_feature_subset is RB-specific (RB's opportunity metrics
# are carries/targets-based, not WR's target-share-only family).

seed: 42

# v1.7 Step 1 (proxy-era sensitivity, src/models/proxy_sensitivity.py,
# outputs/proxy_sensitivity.md): RB is the one position where the decision rule
# (choose Arm B iff its holdout top-10 precision >= Arm A's AND its holdout PR-AUC >=
# Arm A's - 0.02) favored the real-market-only pool -- holdout top-10 0.200 vs 0.100,
# PR-AUC 0.188 vs 0.142, both frozen-hyperparameter arms scored on the identical 2024+2025
# holdout rows. Restricts load_modeling_frame's pool to season >= 2020 (and, via
# cv.validation_folds' MIN_FOLD_TRAIN_YEARS rule, this position's validation folds to
# val 2022/2023 only -- see src/models/train.py's run_full_pipeline).
train_season_start: 2020

optuna:
  classifier_trials: 60 # per model type (LGBM, XGB), on the 4 validation folds
  regression_trials: 30 # per model type (LGBM, XGB) — fewer, per the brief
  tiny_trials: 5 # used by tests/test_models_positions.py; keeps CI fast
  seeds: [42, 1337, 2024] # v1.7 seed ensemble: LGBM+XGB tuned/OOF'd once per seed,
    # raw score = mean of every seed's blended score (src.models.train's
    # run_full_pipeline ensemble mode). The base `seed` above is always kept as
    # part of this list for legacy single-model bundle keys (see train.py).

# Curated subset for the L2 logistic head. Deliberately small and
# low-null — logistic regression has no native handling of missing
# values or high-cardinality/high-null columns the way the tree models do.
# expectation_pos_rank is legitimate: it is knowable before Week 1 (the
# preseason market's own rank), not a leak.
logistic_feature_subset:
  - expectation_pos_rank
  - age
  - year_in_league
  - log_draft_pick
  - games_prior
  - carry_share_n1
  - weighted_opportunity_pg_n1
  - target_share_n1
  - ppr_ppg_n1
  - rush_td_rate_n1
  - efficiency_residual_pg_n1
  - team_change
  - new_hc
  - vacated_carry_share
  - backfield_committee_count_n1

# adp_source is one-hot encoded (ecr / proxy / capped) for the logistic
# head; ecr is the dropped baseline category (2020-2025, the real-market
# era) so the two coefficients read as "proxy-era" / "capped" effects
# relative to it. Identical across every position — adp_source lives on
# labels.parquet, not the position feature table.
adp_source_categories: [ecr, proxy, capped]
adp_source_baseline: ecr

# v1.5 Phase C: Vegas team features (implied_ppg/implied_win_prob/has_vegas,
# src.ingest.vegas -> src.features.shared.attach_vegas_team) are always added to
# the feature matrix, but this position's own trees only see them once the
# promotion experiment (src.models.vegas_experiment) shows a holdout top-10-
# precision improvement -- see that module's docstring for the frozen-
# hyperparameter retrain/compare protocol. Listed here (excluded) by default;
# a promoted position has this list emptied by the experiment run.
# v2.4: team-change/vacancy columns (qb_continuity, vacated_td_share,
# vacated_goal_line_carry_share, max_single_vacated_target_share/carry_share --
# src.features.shared, wired per position) start excluded here too, same
# promotion-rule contract as the Vegas columns above -- src.models.vacancy_gate's
# frozen-hyperparameter retrain empties this list of them iff the gate KEEPs.
excluded_features: [implied_ppg, implied_win_prob, has_vegas, yards_per_snap_n1, catchable_target_rate_n1, yards_per_snap_yoy_delta, catchable_target_rate_yoy_delta]

# v2.4: QUANTILE-head-only exclusions (src.models.vacancy_gate's quantile gate) --
# a column can be REJECTed for the quantile head while still being KEPT for the
# classifier (or vice versa); this list is separate from excluded_features above
# for exactly that reason (see src.models.quantile.tree_feature_columns's
# docstring). Empty until a quantile-gate run rejects something.
excluded_features_quantile: []

# LGBM/XGB train on every numeric feature column in features_rb.parquet
# (identifiers/labels excluded) — trees handle nulls and high cardinality
# natively, no reason to restrict them to the logistic subset.

search_space:
  lgbm:
    max_depth: [3, 5]
    num_leaves: [7, 31]
    min_child_samples: [30, 100] # deliberately high floor — guards against overfitting a smaller-than-WR pool
    learning_rate: [0.01, 0.1]
    n_estimators: [100, 600]
    reg_alpha: [0.0, 5.0] # L1
    reg_lambda: [0.0, 5.0] # L2
    subsample: [0.6, 1.0]
    colsample_bytree: [0.6, 1.0]
  xgb:
    max_depth: [3, 5]
    min_child_weight: [5, 50] # XGB's analogue of min_child_samples
    learning_rate: [0.01, 0.1]
    n_estimators: [100, 600]
    reg_alpha: [0.0, 5.0] # L1
    reg_lambda: [0.0, 5.0] # L2
    subsample: [0.6, 1.0]
    colsample_bytree: [0.6, 1.0]
  logistic:
    # Small fixed grid (not Optuna — the brief scopes Optuna tuning to
    # LGBM/XGB only), evaluated the same way: mean validation PR-AUC
    # across the 4 folds.
    C: [0.01, 0.03, 0.1, 0.3, 1.0, 3.0]

blend:
  grid_step: 0.1 # simplex step for the classifier-trio blend-weight grid search

calibration:
  method_search: [isotonic, platt] # isotonic first choice; falls back to platt if it hurts pooled val Brier

# Age-adjusted-ADP baseline (Deliverable 3.3). Fixed constants, not
# tuned — same constants as WR's config (the brief only says to adapt
# these per position if the config already parameterizes them; there is
# no RB-specific age/experience curve to justify a different bonus/
# threshold, so they are kept identical).
baselines:
  age_adjusted_adp:
    age_bonus: 15
    age_threshold: 25 # bonus applies when age <= this
    year_in_league_bonus: 10
    year_in_league_eligible: [1, 2]

# v2.0 quantile regression head (src/models/quantile.py). Predicts the full
# ppr_ppg distribution (5 quantiles) instead of a binary breakout label --
# see that module's docstring for the full rationale. Hyperparameters are
# tuned ONCE, at alpha=0.50, and reused unmodified (except n_estimators,
# refit per alpha via that alpha's own early stopping) for all 5 alphas --
# per-alpha Optuna re-tuning was judged not worth 5x the compute for a
# quantile head that just needs "reasonable tree shape," not a knife's-edge
# PR-AUC optimum the way the rare-event classifier does.
#
# Single seed (42), no seed ensemble: the v1.7 seed-ensemble fix targeted
# small-sample PR-AUC noise on a 3-6% positive rate (a handful of positives
# flipping a fold's ranking) -- that instability is specific to the rare-
# event classifier. Quantile regression here trains on ALL player-seasons
# (games>=8, in_training_pool==1) with a continuous target and no class
# imbalance at all, so a single deterministic run is not exposed to the same
# small-positive-count noise; re-litigating that with a 3-seed ensemble
# would just be spending compute without addressing an actual instability.
quantile:
  alphas: [0.10, 0.25, 0.50, 0.75, 0.90]
  tune_alpha: 0.50
  seed: 42
  optuna:
    trials: 40 # Optuna trials for the alpha=0.50 tuning pass only
    tiny_trials: 5 # tests/test_quantile.py
