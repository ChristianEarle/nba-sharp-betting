[project]
name = "breakoutlab"
version = "0.1.0"
description = "Preseason NFL fantasy breakout prediction pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.0",
    "polars>=1.0",
    "pyarrow>=16.0",
    "pandas>=2.2",
    "lightgbm>=4.5",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "optuna>=4.0",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
package = false
